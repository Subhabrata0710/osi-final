<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3RD OSI CONFERENCE KOLKATA 2026 | Contact</title>
    <meta name="description" content="India's Premier Conference on Osseointegration &amp; Implant Dentistry - 27-29 November 2026, The Westin, Kolkata">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
    <div id="marquee-placeholder"></div>
    <div id="nav-placeholder"></div>

    <main class="page-section active">

<div class="page-banner">
<span>Get in Touch</span>
<h1>Contact Us</h1>
</div>
<div class="content-section alt-bg">
<div class="container">
<div class="contact-grid">
<div class="contact-info">
<h3>Conference Secretariat</h3>
<div class="contact-item">
<div class="contact-item-icon">✉️</div>
<div class="contact-item-text"><span>Email</span>
<p>registration@osiconkolkata.com</p>
</div>
</div>
<div class="contact-item">
<!-- <div class="contact-item-icon">📞</div>
                            <div class="contact-item-text"><span>Phone</span><p>+91 98765 43210</p></div>
                        </div> -->
<div class="contact-item">
<div class="contact-item-icon">📍</div>
<div class="contact-item-text"><span>Address</span>
<p>The Westin, Rajarhat<br/>Kolkata 700135</p>
</div>
</div>
</div>
<div class="contact-form">
<h3>Send us a Message</h3>
<!--SUCCESS_MESSAGE-->
<form onsubmit="submitForm(event)">
<div class="form-row">
<div class="form-group"><label>Full Name *</label><input name="name" placeholder="Your name" required="" type="text"/></div>
<div class="form-group"><label>Email *</label><input name="email" placeholder="your@email.com" required="" type="email"/></div>
</div>
<div class="form-row">
<!-- <div class="form-group"><label>Phone</label><input type="tel" name="phone" placeholder="+91 98765 43210"></div> -->
<div class="form-group"><label>Subject *</label><input name="subject" placeholder="How can we help?" required="" type="text"/></div>
</div>
<div class="form-group"><label>Message *</label><textarea name="message" placeholder="Your message..." required=""></textarea></div>
<button class="btn btn-primary" style="width: 100%;" type="submit">📨 Send
                                    Message</button>
</form>
</div>
</div>
</div>
</div>
</div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
    <script>
        async function submitForm(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch("https://osi-final.onrender.com/api/contact", {
                method: "POST",
                body: formData
            });
            if (res.ok) {
                alert("Message sent successfully!");
                e.target.reset();
            } else {
                alert("Something went wrong");
            }
        }
    </script>
</body>
</html>
