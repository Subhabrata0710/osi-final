        /* ===== Program page (scoped with pg-). Uses site variables from style.css ===== */
        .pg-hero {
            z-index: 0;
            background: radial-gradient(1200px 400px at 85% -10%, rgba(212, 175, 55, .22), transparent 60%), linear-gradient(135deg, var(--primary) 0%, #00266b 100%);
            color: #fff;
            padding: 72px 0 96px;
            position: relative;
            overflow: hidden
        }

        .pg-hero::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 5px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent)
        }

        .pg-hero .pg-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            align-items: flex-end;
            justify-content: space-between
        }

        .pg-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            line-height: 1.08;
            margin: 0 0 14px;
            color: #fff;
            font-weight: 700
        }

        .pg-hero p {
            margin: 0;
            color: var(--secondary-light);
            font-size: 15px;
            max-width: 520px;
            line-height: 1.6
        }

        .pg-hero .pg-btn {
            display: inline-block;
            padding: 12px 22px;
            border: 1.5px solid var(--secondary);
            color: var(--secondary);
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: .2s
        }

        .pg-hero .pg-btn:hover {
            background: var(--secondary);
            color: var(--primary)
        }

        .pg-wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 20px
        }

        /* day selector */
        .pg-days {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: -52px;
            position: relative;
            z-index: 3
        }

        .pg-day {
            background: #fff;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 18px 20px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 10px 24px -12px rgba(0, 24, 68, .35);
            font-family: 'Manrope', sans-serif;
            transition: transform .2s, border-color .2s
        }

        .pg-day:hover {
            transform: translateY(-2px)
        }

        .pg-day:focus-visible {
            outline: 3px solid var(--secondary);
            outline-offset: 2px
        }

        .pg-day b {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--primary);
            line-height: 1.1
        }

        .pg-day span {
            display: block;
            font-size: 13px;
            color: var(--gray-600);
            margin-top: 6px
        }

        .pg-day small {
            display: block;
            font-weight: 800;
            font-size: 12px;
            color: var(--secondary-dark);
            margin-bottom: 6px
        }

        .pg-day[aria-selected="true"] {
            background: var(--primary);
            border-color: var(--secondary)
        }

        .pg-day[aria-selected="true"] b {
            color: #fff
        }

        .pg-day[aria-selected="true"] span {
            color: var(--secondary-light)
        }

        .pg-day[aria-selected="true"] small {
            color: var(--secondary)
        }

        /* toolbar */
        .pg-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 34px 0 8px
        }

        .pg-bar h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            color: var(--primary);
            margin: 0
        }

        .pg-bar p {
            margin: 2px 0 0;
            font-size: 13px;
            color: var(--gray-600)
        }

        .pg-filter {
            display: inline-flex;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 999px;
            padding: 4px
        }

        .pg-filter button {
            border: 0;
            background: none;
            padding: 8px 16px;
            border-radius: 999px;
            font: 700 13px 'Manrope', sans-serif;
            color: var(--gray-600);
            cursor: pointer
        }

        .pg-filter button[aria-pressed="true"] {
            background: var(--primary);
            color: #fff
        }

        .pg-filter button:focus-visible {
            outline: 2px solid var(--secondary)
        }

        /* rows between sessions */
        .pg-event {
            display: flex;
            gap: 18px;
            align-items: center;
            margin: 22px 0;
            padding: 16px 22px;
            border-radius: var(--radius);
            background: var(--gray-50);
            border: 1px dashed #cbd5e1;
            color: var(--gray-700)
        }

        .pg-event .t {
            font-weight: 800;
            color: var(--secondary-dark);
            font-size: 14px;
            min-width: 128px
        }

        .pg-event .n {
            font-weight: 700;
            color: var(--primary)
        }

        .pg-event .d {
            font-size: 13px;
            color: var(--gray-600);
            display: block;
            font-weight: 500
        }

        .pg-event.key {
            background: linear-gradient(135deg, var(--primary), #00266b);
            border: 0;
            color: #fff
        }

        .pg-event.key .t {
            color: var(--secondary)
        }

        .pg-event.key .n {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem
        }

        .pg-event.key .d {
            color: var(--secondary-light)
        }

            margin: 30px 0;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            overflow: hidden;
            background: #fff;
            box-shadow: var(--shadow-sm)

            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            padding: 12px 22px;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 14px
        }

        .pg-shead i {
            font-style: normal;
            color: var(--secondary)
        }

        .pg-cols {
            display: grid;
            grid-template-columns: 1fr 1fr
        }

        .pg-cols.one {
            grid-template-columns: 1fr
        }

        .pg-hall {
            padding: 22px;
            min-width: 0
        }

        .pg-hall+.pg-hall {
            border-left: 1px solid var(--gray-200)
        }

        .pg-hall h3 {
            margin: 0 0 4px;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--primary);
            line-height: 1.25
        }

        .pg-tag {
            display: inline-block;
            margin-bottom: 14px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--secondary-light);
            color: var(--secondary-dark);
            font-weight: 800;
            font-size: 12px
        }

        .pg-hall.b .pg-tag {
            background: #dbe6ff;
            color: var(--primary-light)
        }

        .pg-list {
            list-style: none;
            margin: 0;
            padding: 0;
            position: relative
        }

        .pg-list::before {
            content: "";
            position: absolute;
            left: 5px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--gray-200)
        }

        .pg-item {
            position: relative;
            padding: 0 0 18px 28px
        }

        .pg-item:last-child {
            padding-bottom: 0
        }

        .pg-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--secondary)
        }

        .pg-item.panel::before {
            border-color: var(--primary);
            background: var(--primary)
        }

        .pg-item .tm {
            font-size: 12px;
            font-weight: 800;
            color: var(--secondary-dark)
        }

        .pg-item .nm {
            font-weight: 800;
            color: var(--primary);
            font-size: 15px;
            line-height: 1.35
        }

        .pg-item .tp {
            font-size: 13.5px;
            color: var(--gray-600);
            line-height: 1.5;
            margin-top: 1px
        }

        .pg-item.panel .nm {
            font-weight: 700
        }

        .pg-item.panel .tp {
            font-weight: 600;
            color: var(--gray-700)
        }

            color: #94a3b8;
            font-style: italic;
            font-weight: 600

            background: #fff7e0;
            border: 1px solid var(--secondary-light);
            border-radius: 10px;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.35
        }

            margin: 36px 0 70px;
            text-align: center;
            font-size: 13px;
            color: var(--gray-600)
        }

        .pg-day-panel[hidden] {
            display: none
        }

                border-top: 1px solid var(--gray-200)

            .pg-days {
                gap: 8px

            .pg-day {
                padding: 12px
            }

            .pg-day b {
                font-size: 1.05rem
            }

            .pg-day span {
                display: none
            }

            .pg-event {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px
            }

            .pg-hero {
                padding: 48px 0 80px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }

                                    ['5:00 – 5:30 PM', 'Dr. Neeraj Chandrakar', 'One arch, many designs: biomechanical principles and material choice in implant rehabilitation'],
                                    ['5:30 – 6:00 PM', 'Dr. Mayank Ojha', 'Bioline speaker'],
                                    ['6:00 – 6:15 PM', 'Panel discussion · Moderator: to be announced', '', 'p']]
                            }]
                    },
                    { ev: 1, key: 1, t: '6:15 – 7:00 PM', n: 'Valedictory Function' }
                ]
            }
        };

        /* ---------- RENDER ---------- */
        const out = document.getElementById('pg-out'), esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        let day = 'd2', filt = 'all';

        function item(it) {
            let [tm, nm, tp, k] = it;
            if (it.length === 3 && (it[2] === '' || it[0] === 'Panel discussion')) [tm, nm, tp, k] = [it[0], it[1], it[2], it[3]]; // keep as is
            if (tm === 'Panel discussion') { return `<li class="pg-item panel"><div class="nm">${esc(tm)}</div><div class="tp">${esc(nm)}</div></li>`; }
            const tb = k === 'tba' ? ' tba' : '', pn = k === 'p' ? ' panel' : '';
            if (k === 'p') { const parts = nm.split(' · '); return `<li class="pg-item panel"><div class="tm">${esc(tm)}</div><div class="nm">${esc(parts[0])}</div>${parts[1] ? `<div class="tp">${esc(parts[1])}</div>` : ''}</li>`; }
            return `<li class="pg-item${tb}${pn}"><div class="tm">${esc(tm)}</div><div class="nm">${esc(nm)}</div>${tp ? `<div class="tp">${esc(tp)}</div>` : ''}</li>`;
        }
        function hall(h) {
            return `<section class="pg-hall ${h.h.toLowerCase()}" aria-label="Hall ${h.h}"><span class="pg-tag">Hall ${h.h}</span><h3>${esc(h.t)}</h3>${h.deb ? `<p class="pg-debate">${esc(h.deb)}</p>` : '<div style="height:10px"></div>'}<ul class="pg-list">${h.i.map(item).join('')}</ul></section>`;
        }
        function render() {
            const d = DAYS[day];
            document.getElementById('pg-title').textContent = d.title;
            document.getElementById('pg-sub').textContent = d.sub;
            document.getElementById('pg-filter').style.display = day === 'd1' ? 'none' : '';
            document.querySelectorAll('.pg-day').forEach(b => b.setAttribute('aria-selected', b.dataset.day === day));
            out.setAttribute('aria-labelledby', 'tab-' + day);
            out.innerHTML = d.blocks.map(b => {
                if (b.ev) return `<div class="pg-event${b.key ? ' key' : ''}"><div class="t">${esc(b.t)}</div><div><span class="n">${esc(b.n)}</span>${b.d ? `<span class="d">${esc(b.d)}</span>` : ''}</div></div>`;
                const hs = b.halls.filter(h => filt === 'all' || h.h === filt);
                return `<article class="pg-session"><div class="pg-shead"><span>${esc(b.s)}</span><i>${esc(b.time)}</i></div><div class="pg-cols${hs.length === 1 ? ' one' : ''}">${hs.map(hall).join('')}</div></article>`;
            }).join('');
        }
        document.querySelectorAll('.pg-day').forEach(b => b.addEventListener('click', () => { day = b.dataset.day; history.replaceState(null, '', '#' + day); render(); window.scrollTo({ top: document.querySelector('.pg-days').offsetTop - 90, behavior: 'smooth' }) }));
        document.querySelectorAll('#pg-filter button').forEach(b => b.addEventListener('click', () => { filt = b.dataset.f; document.querySelectorAll('#pg-filter button').forEach(x => x.setAttribute('aria-pressed', x === b)); render() }));
        if (DAYS[location.hash.slice(1)]) day = location.hash.slice(1);
        render();
    </script>
</body>
