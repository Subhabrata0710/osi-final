    <style>
        /* ---- Program page additions (uses existing site color variables) ---- */
        .session-item {
            border-left: 4px solid var(--secondary);
        }

        .session-item.type-break,
        .session-item.type-ceremony {
            border-left-color: var(--gray-200);
        }

        .session-speaker {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
            margin-top: -2px;
            margin-bottom: 8px;
        }

        .session-type.panel {
            background: #f3e8ff;
            color: #7c3aed;
        }

        .session-type.industrial {
            background: var(--secondary);
            color: var(--primary);
        }

        .session-type.live {
            background: #fee2e2;
            color: #b91c1c;
        }

        .session-divider {
            margin: 32px 0 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--secondary-light);
            color: var(--primary);
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
        }

        .session-divider:first-of-type {
            margin-top: 8px;
        }

        .session-divider small {
            display: block;
            font-family: 'Manrope', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--secondary-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .day-contact {
            margin-top: 24px;
            padding: 16px 20px;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 13px;
            color: var(--gray-600);
            text-align: center;
        }

        .day-contact strong {
            color: var(--primary);
        }

        .placeholder-note {
            text-align: center;
            padding: 60px 24px;
            color: var(--gray-600);
            background: var(--gray-50);
            border: 1px dashed var(--gray-200);
            border-radius: var(--radius);
        }

        .placeholder-note h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }
    </style>
</head>

            <script>
                function switchWorkshop(selector) {
                    // var tabs = ['neuro', 'simwars', 'woodlands', 'programme'];
                    var tabs = ['programme']
                    tabs.forEach(function (t) {
                        document.getElementById(t + '-workshop').style.display = 'none';
                        document.getElementById('btn-' + t).classList.remove('active');
                    });
                    document.getElementById(selector + '-workshop').style.display = 'block';
                    document.getElementById('btn-' + selector).classList.add('active');
                }

                function switchDay(day) {
                    document.getElementById('prog-day1').style.display = day === 'day1' ? 'block' : 'none';
                    document.getElementById('prog-day2').style.display = day === 'day2' ? 'block' : 'none';
                    document.getElementById('btn-day1').classList.toggle('active', day === 'day1');
                    document.getElementById('btn-day2').classList.toggle('active', day === 'day2');
                }
            </script>
