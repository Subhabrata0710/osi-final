<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSICON Kolkata 2026 | Registration Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #002366;
            --primary-light: #f5f3ff;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --bg-gradient: linear-gradient(135deg, #002366 0%, #002366 100%);
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-wrapper {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
        }

        .event-header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 25px;
        }

        .conference-name {
            display: block;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .society-name {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
            margin: 5px 0 15px 0;
        }

        .info-pill {
            background: var(--primary-light);
            padding: 12px;
            border-radius: 16px;
            font-size: 13px;
            color: var(--text-dark);
            line-height: 1.6;
        }

        .info-pill a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .section-header {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 30px 0 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 4px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #f9fafb;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .scroll-wrapper {
            position: relative;
            margin-top: 10px;
        }

        .category-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #f3f4f6;
            border-radius: 16px;
            background: #fff;
        }

        .scroll-badge {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                bottom: 20px;
            }

            50% {
                bottom: 25px;
            }
        }

        .category-card {
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .category-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .category-card:has(input:checked) {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .category-card input {
            display: none;
        }

        .cat-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dark);
            max-width: 70%;
        }

        .cat-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        .summary-bar {
            background: #111827;
            color: white;
            padding: 24px;
            border-radius: 20px;
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-text {
            font-size: 14px;
            opacity: 0.8;
        }

        .total-val {
            font-size: 28px;
            font-weight: 800;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .category-container::-webkit-scrollbar {
            width: 5px;
        }

        .category-container::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 10px;
        }

        @media (max-width: 500px) {
            .grid-row {
                grid-template-columns: 1fr;
            }

            .summary-bar {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="form-wrapper">
        <div class="event-header">
            <span class="conference-name">3rd Annual Conference</span>
            <span class="society-name">Osseointegration Society of India</span>
            <div class="info-pill">
                <strong>27th - 29th November 2026</strong> | KOLKATA<br>
                <!-- <a href="https://www.osiconkolkata2026.com" target="_blank">www.osiconkolkata2026.com</a> |  -->
                <a href="mailto:registration@osiconkolkata.com">registration@osiconkolkata.com</a>
            </div>
        </div>

        <form id="mainForm">
            <div class="section-header" style="justify-content: space-between;">
                <span>Delegate Information</span>
                <button type="button" id="fetchDetailsBtn"
                    style="font-size: 12px; padding: 6px 12px; border-radius: 6px; background: var(--primary-light); color: var(--primary); border: 1px solid var(--primary); cursor: pointer; font-weight: 600;">Already
                    Registered? Fetch Details</button>
            </div>
            <div class="input-group">
                <label>Full Name *</label>
                <input type="text" id="userName" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <label>Email Address *</label>
                <input type="email" id="userEmail" placeholder="name@domain.com" required>
            </div>
            <div class="grid-row">
                <div class="input-group">
                    <label>Mobile Number *</label>
                    <input type="tel" id="userPhone" placeholder="+91" required>
                </div>
                <div class="input-group">
                    <label>I am a *</label>
                    <select id="userType" required
                        style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: #f9fafb; font-family: inherit; font-size: 14px; box-sizing: border-box;"
                        onchange="toggleMembershipField()">
                        <option value="">Select Option</option>
                        <option value="osi_member">OSI Member</option>
                        <option value="non_osi_member">Non OSI Member</option>
                        <option value="student">Student</option>
                    </select>
                </div>
            </div>
            <div class="input-group" id="membershipField" style="display: none;">
                <label>OSI Membership Number *</label>
                <input type="text" id="usermember" placeholder="Enter your OSI Membership Number">
            </div>
            <script>
                function toggleMembershipField() {
                    const userType = document.getElementById('userType').value;
                    const membershipField = document.getElementById('membershipField');
                    const usermemberInput = document.getElementById('usermember');
                    if (userType === 'osi_member') {
                        membershipField.style.display = 'block';
                        usermemberInput.required = true;
                        usermemberInput.value = '';
                    } else {
                        membershipField.style.display = 'none';
                        usermemberInput.required = false;
                        usermemberInput.value = 'NA';
                    }
                }
            </script>
            <div class="grid-row">
                <div class="input-group">
                    <label>State *</label>
                    <input type="text" id="userState" placeholder="Enter your state" required>
                </div>
                <div class="input-group">
                    <label>City *</label>
                    <input type="text" id="userCity" placeholder="Enter your city" required>
                </div>
            </div>
            <div class="input-group">
                <label>Voucher Code (Optional)</label>
                <input type="text" id="voucherCode" placeholder="Enter voucher code if any"
                    style="text-transform: uppercase;">
            </div>



            <div class="section-header">
                Select Workshop (Optional)
            </div>
            <div class="scroll-wrapper">
                <div class="category-container" style="max-height: max-content;">
                    <label class="category-card">
                        <input type="checkbox" id="workshop-osseo" class="workshop-checkbox"
                            value="Course Topic: Osseodensification" data-price="20000">
                        <span class="cat-label" id="osseo-label">Course Topic: Osseodensification [Dr. Salah
                            Huwais]</span>
                        <span class="cat-price">₹20,000</span>
                    </label>
                    <label class="category-card">
                        <input type="checkbox" id="workshop-lecture" class="workshop-checkbox"
                            value="Workshop: PREDICTABLE MANAGEMENT OF PERI-IMPLANTITIS (Lecture)" data-price="5000">
                        <span class="cat-label">PREDICTABLE MANAGEMENT OF PERI-IMPLANTITIS (Lecture) [DR. FRANK
                            SCHWARZ]</span>
                        <span class="cat-price">₹5,000</span>
                    </label>
                    <label class="category-card">
                        <input type="checkbox" id="workshop-hands-on" class="workshop-checkbox"
                            value="Workshop: PREDICTABLE MANAGEMENT OF PERI-IMPLANTITIS (Hands on workshop)"
                            data-price="18000">
                        <span class="cat-label">PREDICTABLE MANAGEMENT OF PERI-IMPLANTITIS (Hands on workshop) [DR.
                            FRANK
                            SCHWARZ]</span>
                        <span class="cat-price">₹18,000</span>
                    </label>
                    <label class="category-card">
                        <input type="checkbox" id="workshop-lecture-henry" class="workshop-checkbox"
                            value="Workshop: Reaching Unreachables: Pterygoid, Transnasal & Fast-Track Mastery (Lecture)"
                            data-price="5000">
                        <span class="cat-label">Reaching Unreachables: Pterygoid, Transnasal & Fast-Track Mastery
                            (Lecture) [DR. HENRY DIEDERICH]</span>
                        <span class="cat-price">₹5,000</span>
                    </label>
                    <label class="category-card">
                        <input type="checkbox" id="workshop-hands-on-henry" class="workshop-checkbox"
                            value="Workshop: Reaching Unreachables: Pterygoid, Transnasal & Fast-Track Mastery (Lecture with Hands on)"
                            data-price="10000">
                        <span class="cat-label">Reaching Unreachables: Pterygoid, Transnasal & Fast-Track Mastery
                            (Lecture with Hands on) [DR. HENRY DIEDERICH]</span>
                        <span class="cat-price">₹10,000</span>
                    </label>
                </div>
            </div>

            <div class="section-header">
                Select Registration Category
                <span id="validTillText" style="font-size: 0.75em; font-weight: bold;">(* Prices are valid till 15th
                    April 2026)</span>
            </div>

            <div class="scroll-wrapper">
                <!--<div id="scrollBadge" class="scroll-badge">
                <span>See more options</span> <span>↓</span>
            </div>-->
                <div class="category-container" id="categoryList">
                    <label class="category-card" id="special-offer-container" style="display: none;">
                        <input type="radio" id="cat-special" name="cat" data-price="11000">
                        <span class="cat-label">PRF Ocean & Osteoimmunology Masterclass Special registration
                            offer</span>
                        <span class="cat-price">₹11,000</span>
                    </label>
                    <label class="category-card" id="1day" style="display: none;">
                        <input type="radio" id="1day" name="cat" data-price="2000">
                        <span class="cat-label">1 DAY IMPLANT EXTRAVAGANZA</span>
                        <span class="cat-price">₹2,000</span>
                    </label>

                    <div style="width: 100%; display: flex; flex-direction: column;">
                        <label class="category-card">
                            <input type="radio" id="cat-workshop-only" name="cat" data-price="0">
                            <span class="cat-label">Already Registered?</span>
                            <span class="cat-price">₹0</span>
                        </label>
                        <div id="regIdField" style="display: none; margin-top: 10px; margin-bottom: 10px;">
                            <input type="text" id="registrationId"
                                placeholder="Enter Regs ID (sent to mail) or contact 9830367423"
                                style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background: #fff;">
                        </div>
                    </div>


                    <label class="category-card">
                        <input type="radio" id="cat-non-osi" name="cat" data-price="12390" required>
                        <span class="cat-label">Non OSI Member</span>
                        <span class="cat-price">₹12,390</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-osi" name="cat" data-price="10620">
                        <span class="cat-label">OSI Member</span>
                        <span class="cat-price">₹10,620</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-student" name="cat" data-price="5500">
                        <span class="cat-label">Students Offer (without hospitality)</span>
                        <span class="cat-price">₹5,500</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-life" name="cat" data-price="17700">
                        <span class="cat-label">Registration + Life Membership</span>
                        <span class="cat-price">₹17,700</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-westin-2n-single" name="cat" data-price="46020">
                        <span class="cat-label">Registration + Westin 2 nights (Single Occupancy)</span>
                        <span class="cat-price">₹46,020</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-westin-2n-twin" name="cat" data-price="28320">
                        <span class="cat-label">Registration + Westin 2 nights (Twin Sharing)</span>
                        <span class="cat-price">₹28,320</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-westin-2n-twin-life" name="cat" data-price="35320">
                        <span class="cat-label">Registration + Westin 2 nights (Twin) + Life Membership</span>
                        <span class="cat-price">₹35,320</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-westin-2n-single-life" name="cat" data-price="53020">
                        <span class="cat-label">Registration + Westin 2 nights (Single) + Life Membership</span>
                        <span class="cat-price">₹53,020</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-westin-3n-single" name="cat" data-price="63720">
                        <span class="cat-label">Registration + Westin 3 nights (Single Occupancy)</span>
                        <span class="cat-price">₹63,720</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-westin-3n-twin" name="cat" data-price="37170">
                        <span class="cat-label">Registration + Westin 3 nights (Twin Sharing)</span>
                        <span class="cat-price">₹37,170</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-westin-3n-single-life" name="cat" data-price="70720">
                        <span class="cat-label">Registration + Westin 3 nights (Single) + Life Membership</span>
                        <span class="cat-price">₹70,720</span>
                    </label>
                    <label class="category-card">
                        <input type="radio" id="cat-reg-westin-3n-twin-life" name="cat" data-price="44170">
                        <span class="cat-label">Registration + Westin 3 nights (Twin) + Life Membership</span>
                        <span class="cat-price">₹44,170</span>
                    </label>

                </div>
            </div>


            <div class="summary-bar">
                <div>
                    <div class="total-text">Total Payable Amount</div>
                    <div style="font-size: 11px; opacity: 0.6;">(Inclusive of all taxes)</div>
                </div>
                <div class="total-val" id="totalDisplay">₹0</div>
            </div>

            <button type="submit" class="submit-btn">Complete Registration</button>
        </form>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        const form = document.getElementById('mainForm');
        const totalDisplay = document.getElementById('totalDisplay');
        const categoryList = document.getElementById('categoryList');
        const scrollBadge = document.getElementById('scrollBadge');

        // Dynamic Pricing Logic
        const categoryPricing = {
            "cat-workshop-only": [0, 0, 0, 0, 0],
            "1day": [2000, 2000, 2000, 2000, 2000],
            "cat-special": [11000, 11000, 11000, 11000, 11000],
            "cat-non-osi": [12390, 14160, 15930, 17700, 19470],
            "cat-osi": [10620, 12390, 14160, 15930, 17700],
            "cat-student": [5500, 5500, 5500, 5500, 5500],
            "cat-reg-life": [17700, 19470, 21240, 23010, 24780],
            "cat-reg-westin-2n-single": [46020, 47790, 49560, 51330, 53100],
            "cat-reg-westin-2n-twin": [28320, 30090, 31860, 33630, 35400],
            "cat-reg-westin-2n-twin-life": [35320, 37090, 38860, 40630, 42400],
            "cat-reg-westin-2n-single-life": [53020, 54790, 56560, 58330, 60100],
            "cat-reg-westin-3n-single": [63720, 65490, 67260, 69030, 70800],
            "cat-reg-westin-3n-twin": [37170, 38940, 40710, 42480, 44250],
            "cat-reg-westin-3n-single-life": [70720, 72490, 74260, 76030, 77800],
            "cat-reg-westin-3n-twin-life": [44170, 45940, 47710, 49480, 51250]
        };

        function getCurrentTier() {
            const now = new Date();
            if (now < new Date('2026-04-16T00:00:00+05:30')) return { index: 0, label: "Prices are valid till 15th April 2026" };
            if (now < new Date('2026-06-01T00:00:00+05:30')) return { index: 1, label: "Prices are valid till 31st May 2026" };
            if (now < new Date('2026-09-01T00:00:00+05:30')) return { index: 2, label: "Prices are valid till 31st August 2026" };
            if (now < new Date('2026-11-27T00:00:00+05:30')) return { index: 3, label: "Prices are valid till 26th November 2026" };
            return { index: 4, label: "Spot Registration Prices" };
        }

        function updateDynamicPricing() {
            const now = new Date();
            const specialContainer = document.getElementById('special-offer-container');
            const oneDayContainer = document.getElementById('1day');
            // Show only from 3rd May 2026 to 4th May 2026 midnight
            if (now >= new Date('2026-07-26T00:00:00+05:30') && now < new Date('2026-07-27T00:00:00+05:30')) {
                if (specialContainer) specialContainer.style.display = 'flex';
            } else {
                if (specialContainer) specialContainer.style.display = 'none';
            }


            if (now >= new Date('2026-07-02T00:00:00+05:30') && now < new Date('2026-07-06T00:00:00+05:30')) {
                if (oneDayContainer) oneDayContainer.style.display = 'flex';
            } else {
                if (oneDayContainer) oneDayContainer.style.display = 'none';
            }
            const tier = getCurrentTier();

            const validTillSpan = document.getElementById('validTillText');
            if (validTillSpan) {
                if (tier.index === 4) {
                    validTillSpan.innerText = `(* ${tier.label})`;
                } else {
                    validTillSpan.innerText = `(* ${tier.label})`;
                }
            }

            for (const [id, prices] of Object.entries(categoryPricing)) {
                const input = document.getElementById(id);
                if (input) {
                    const currentPrice = prices[tier.index];
                    input.setAttribute('data-price', currentPrice);
                    const priceDisplay = input.parentElement.querySelector('.cat-price');
                    if (priceDisplay) {
                        priceDisplay.innerText = `₹${new Intl.NumberFormat('en-IN').format(currentPrice)}`;
                    }
                }
            }
        }

        // Run on load
        updateDynamicPricing();

        // Replace with your actual Deployed Web App URL
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_iBlR7yRANYPlQ-poyLlgjFzvBdjSPGgHTd6DCjjWoxD9rG7TC9T0GtWmHFH_0e2o/exec';

        // Check Osseodensification and New Workshops Capacity
        fetch(`${GOOGLE_SCRIPT_URL}?action=getCapacity`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.countOsseo >= 30) {
                        const osseoInput = document.getElementById('workshop-osseo');
                        if (osseoInput) {
                            osseoInput.disabled = true;
                            osseoInput.parentElement.style.opacity = '0.5';
                            osseoInput.parentElement.style.pointerEvents = 'none';
                            const label = document.getElementById('osseo-label');
                            if (label) label.innerText = 'Course Topic: Osseodensification (SOLD OUT)';
                        }
                    }
                    if (data.countLecture >= 30) {
                        const lectureInput = document.getElementById('workshop-lecture-henry');
                        if (lectureInput) {
                            lectureInput.disabled = true;
                            lectureInput.parentElement.style.opacity = '0.5';
                            lectureInput.parentElement.style.pointerEvents = 'none';
                            const label = lectureInput.nextElementSibling;
                            if (label) label.innerText = 'Reaching Unreachables: Pterygoid, Transnasal & Fast-Track Mastery (Lecture) [DR. HENRY DIEDERICH] (SOLD OUT)';
                        }
                    }
                    if (data.countHandsOn >= 30) {
                        const handsOnInput = document.getElementById('workshop-hands-on-henry');
                        if (handsOnInput) {
                            handsOnInput.disabled = true;
                            handsOnInput.parentElement.style.opacity = '0.5';
                            handsOnInput.parentElement.style.pointerEvents = 'none';
                            const label = handsOnInput.nextElementSibling;
                            if (label) label.innerText = 'Reaching Unreachables: Pterygoid, Transnasal & Fast-Track Mastery (Lecture with Hands on) [DR. HENRY DIEDERICH] (SOLD OUT)';
                        }
                    }
                }
            })
            .catch(err => console.error('Error fetching capacity', err));

        // 1. Total Price Calculation Logic
        function updateTotal() {
            const selectedRadio = document.querySelector('input[name="cat"]:checked');
            let amount = 0;
            if (selectedRadio) {
                amount = parseInt(selectedRadio.getAttribute('data-price'));
                const voucherCode = document.getElementById('voucherCode').value.trim().toUpperCase();

                if (voucherCode === 'IMPACT_OSI') {
                    amount = 10500;
                }
                if (voucherCode === 'SPECIAL_OSI') {
                    amount = 11000;
                }
            }

            const workshopOsseo = document.getElementById('workshop-osseo');
            const workshopLecture = document.getElementById('workshop-lecture');
            const workshopHandsOn = document.getElementById('workshop-hands-on');
            const workshopLectureHenry = document.getElementById('workshop-lecture-henry');
            const workshopHandsOnHenry = document.getElementById('workshop-hands-on-henry');
            if (workshopOsseo && workshopOsseo.checked) {
                amount += parseInt(workshopOsseo.getAttribute('data-price'));
            }
            if (workshopLecture && workshopLecture.checked) {
                amount += parseInt(workshopLecture.getAttribute('data-price'));
            }
            if (workshopHandsOn && workshopHandsOn.checked) {
                amount += parseInt(workshopHandsOn.getAttribute('data-price'));
            }
            if (workshopLectureHenry && workshopLectureHenry.checked) {
                amount += parseInt(workshopLectureHenry.getAttribute('data-price'));
            }
            if (workshopHandsOnHenry && workshopHandsOnHenry.checked) {
                amount += parseInt(workshopHandsOnHenry.getAttribute('data-price'));
            }

            if (amount > 0) {
                const formatted = new Intl.NumberFormat('en-IN').format(amount);
                totalDisplay.innerText = '₹' + formatted;

                totalDisplay.animate([
                    { transform: 'scale(1)', color: '#fff' },
                    { transform: 'scale(1.1)', color: '#818cf8' },
                    { transform: 'scale(1)', color: '#fff' }
                ], { duration: 300 });
            } else {
                totalDisplay.innerText = '₹0';
            }
        }

        form.addEventListener('change', (e) => {
            if (e.target.name === 'cat') {
                const regIdField = document.getElementById('regIdField');
                const regIdInput = document.getElementById('registrationId');
                if (document.getElementById('cat-workshop-only').checked) {
                    regIdField.style.display = 'block';
                    regIdInput.required = false; // Registration ID is no longer mandatory since we fetch it
                } else {
                    regIdField.style.display = 'none';
                    regIdInput.required = false;
                }
                updateTotal();
            } else if (e.target.classList.contains('workshop-checkbox')) {
                updateTotal();
            }
        });

        // Fetch Details Logic
        document.getElementById('fetchDetailsBtn').addEventListener('click', async () => {
            const email = document.getElementById('userEmail').value.trim();
            const phone = document.getElementById('userPhone').value.trim();

            if (!email || !phone) {
                alert('Please enter both Email and Mobile Number to fetch your details.');
                return;
            }

            const btn = document.getElementById('fetchDetailsBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Fetching...';
            btn.disabled = true;

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=lookup&email=${encodeURIComponent(email)}&phone=${encodeURIComponent(phone)}`);
                const result = await response.json();

                if (result.success && result.data) {
                    document.getElementById('userName').value = result.data.name || '';
                    document.getElementById('userState').value = result.data.state || '';
                    document.getElementById('userCity').value = result.data.city || '';

                    if (result.data.member && result.data.member !== 'N/A') {
                        document.getElementById('userType').value = 'osi_member';
                        toggleMembershipField();
                        document.getElementById('usermember').value = result.data.member;
                    }

                    // Auto-select "Already Registered" and fill Reg ID
                    document.getElementById('cat-workshop-only').checked = true;
                    document.getElementById('regIdField').style.display = 'block';
                    document.getElementById('registrationId').value = result.data.serialNumber || '';

                    updateTotal();
                    alert('Details fetched successfully! You can now select your workshops.');
                } else {
                    alert(result.message || 'No registration found for this Email and Phone.');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('An error occurred while fetching details. Please try again.');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('voucherCode').addEventListener('input', () => {
            updateTotal();
        });

        // 2. Floating Badge Logic
        categoryList.addEventListener('scroll', () => {
            if (categoryList.scrollTop > 10) {
                scrollBadge.style.opacity = '0';
                scrollBadge.style.visibility = 'hidden';
            } else {
                scrollBadge.style.opacity = '1';
                scrollBadge.style.visibility = 'visible';
            }
        });

        // 3. Unified Submission & Razorpay Logic
        form.onsubmit = function (e) {
            e.preventDefault();

            // Capture data
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const phone = document.getElementById('userPhone').value;
            const member = document.getElementById('usermember').value; // Matching your HTML ID
            const state = document.getElementById('userState').value;
            const city = document.getElementById('userCity').value;

            const selectedRadio = document.querySelector('input[name="cat"]:checked');
            if (!selectedRadio) {
                alert("Please select a registration category");
                return;
            }

            let amountInInr = parseInt(selectedRadio.getAttribute('data-price'));
            const voucherCode = document.getElementById('voucherCode').value.trim().toUpperCase();
            if (voucherCode === 'IMPACT_OSI') {
                amountInInr = 10500;
            }
            if (voucherCode === 'SPECIAL_OSI') {
                amountInInr = 11000;
            }

            let categoryLabel = selectedRadio.parentElement.querySelector('.cat-label').innerText;
            if (selectedRadio.id === 'cat-workshop-only') {
                const regId = document.getElementById('registrationId').value.trim();
                categoryLabel += " (Reg ID: " + regId + ")";
            }

            if (voucherCode === 'IMPACT_OSI') {
                categoryLabel += " (Voucher: IMPACT_OSI)";
            }
            if (voucherCode === 'SPECIAL_OSI') {
                categoryLabel += " (Voucher: SPECIAL_OSI)";
            }

            const workshopOsseo = document.getElementById('workshop-osseo');
            const workshopLecture = document.getElementById('workshop-lecture');
            const workshopHandsOn = document.getElementById('workshop-hands-on');
            if (workshopOsseo && workshopOsseo.checked) {
                amountInInr += parseInt(workshopOsseo.getAttribute('data-price'));
                categoryLabel += " + " + workshopOsseo.value;
            }
            if (workshopLecture && workshopLecture.checked) {
                amountInInr += parseInt(workshopLecture.getAttribute('data-price'));
                categoryLabel += " + " + workshopLecture.value;
            }
            if (workshopHandsOn && workshopHandsOn.checked) {
                amountInInr += parseInt(workshopHandsOn.getAttribute('data-price'));
                categoryLabel += " + " + workshopHandsOn.value;
            }

            if (amountInInr <= 0) {
                alert("Please select at least one valid workshop or registration category.");
                return;
            }

            const options = {
                "key": "rzp_live_S9kFXcSkm7C1Rc",
                "amount": amountInInr * 100,
                "currency": "INR",
                "name": "OSICON Kolkata 2026",
                "description": "Registration for " + categoryLabel,
                "handler": function (response) {
                    // This triggers ONLY after successful payment
                    saveToGoogleSheets(name, email, phone, member, categoryLabel, amountInInr, response.razorpay_payment_id, state, city);
                },
                "prefill": {
                    "name": name,
                    "email": email,
                    "contact": phone
                },
                "theme": {
                    "color": "#4f46e5"
                }
            };








            // // Test Mode: Bypass Razorpay
            // if (confirm("TEST MODE: Bypass Razorpay payment and submit directly?")) {
            //     saveToGoogleSheets(name, email, phone, member, categoryLabel, amountInInr, "pay_test_" + Date.now());
            //     return;
            // }








            const rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response) {
                alert("Payment Failed: " + response.error.description);
            });
            rzp1.open();
        };

        // 4. Send Data to Google Sheets
        function saveToGoogleSheets(name, email, phone, member, category, amount, paymentId, state, city) {
            const formData = new URLSearchParams();
            const voucherCode = document.getElementById('voucherCode') ? document.getElementById('voucherCode').value.trim().toUpperCase() : '';

            formData.append('name', name);
            formData.append('email', email);
            formData.append('phone', phone);
            formData.append('member', member);
            formData.append('state', state);
            formData.append('city', city);
            formData.append('category', category);
            formData.append('amount', amount);
            formData.append('payment_id', paymentId);
            if (voucherCode) {
                formData.append('voucherCode', voucherCode);
            }

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
                .then(() => {
                    alert("Payment Successful! Your registration for OSICON 2026 is confirmed.");
                    window.location.reload();
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert("Payment recorded, but there was an error updating the sheet. Please contact support.");
                });
        }
    </script>
